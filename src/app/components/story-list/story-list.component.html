

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search for news</mat-label>

  <input
    matInput
    type="search"
    placeholder="Search stories…"
    [(ngModel)]="query"
  (ngModelChange)="applyFilter()"
  />

  <button
    *ngIf="query"
    mat-icon-button
    matSuffix
    aria-label="Clear"
    (click)="clearSearch()">
    <mat-icon>close</mat-icon>
  </button>

  <mat-icon matSuffix *ngIf="!query">search</mat-icon>
</mat-form-field>

<mat-card class="story-card mat-elevation-z4">

  <mat-card-title>Latest Stories</mat-card-title>
  <mat-card-subtitle>
    Hacker News · Page {{ pageIndex + 1 }}
  </mat-card-subtitle>

  <mat-divider></mat-divider>

<div class="loading-overlay" *ngIf="loading">
  <mat-spinner diameter="48"></mat-spinner>
</div>
  <div class="table-container">
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Title</th>
    <td mat-cell *matCellDef="let s">{{ s.title }}</td>
  </ng-container>

  <ng-container matColumnDef="by">
    <th mat-header-cell *matHeaderCellDef>By</th>
    <td mat-cell *matCellDef="let s">{{ s.by }}</td>
  </ng-container>

  <ng-container matColumnDef="score">
    <th mat-header-cell *matHeaderCellDef>Score</th>
    <td mat-cell *matCellDef="let s">{{ s.score }}</td>
  </ng-container>

  <ng-container matColumnDef="time">
    <th mat-header-cell *matHeaderCellDef>Published</th>
    <td mat-cell *matCellDef="let s">
      {{ formatDate(s.time) }}
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let s">
      <button
        mat-icon-button
        color="primary"
        (click)="openStory(s.url)"
        [disabled]="!s.url">
        <mat-icon>open_in_new</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
  </div>

  <mat-divider></mat-divider>

  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons>
  </mat-paginator>

</mat-card>
